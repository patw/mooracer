[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mooracer"
version = "0.1.0"
description = "Pure-Python network client for MooRacer, the in-memory document data engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["flatbuffers>=23.5.26"]
authors = [{ name = "Pat Wendorf", email = "dungeons@gmail.com" }]
keywords = ["database", "document-store", "mongodb", "in-memory", "flatbuffers",
            "vector-search", "text-search", "bm25", "redis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
"Homepage" = "https://github.com/patw/mooracer"
"Repository" = "https://github.com/patw/mooracer"
"Bug Tracker" = "https://github.com/patw/mooracer/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["mooracer", "mooracer.wire"]
license-files = ["LICENSE"]
